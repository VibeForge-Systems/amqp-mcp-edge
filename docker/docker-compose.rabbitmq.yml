services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: amqp-mcp-edge-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mcp
      RABBITMQ_DEFAULT_PASS: discovery
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10