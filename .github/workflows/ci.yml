name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, because a tag can be moved after review. The comment
# names the release each SHA was taken from; bump them together (Dependabot does).
jobs:
  test:
    runs-on: ubuntu-latest
    # A hung broker connection must fail the job in minutes, not hold a runner for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
          # The management API: the least-privilege integration tests create a vhost and a user.
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: mcp
          RABBITMQ_DEFAULT_PASS: discovery
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
        env:
          AMQP_INTEGRATION_URL: amqp://mcp:discovery@127.0.0.1:5672
          # The management credentials default to those of AMQP_INTEGRATION_URL.
          AMQP_INTEGRATION_MANAGEMENT_URL: http://127.0.0.1:15672
          # Fail, rather than skip, the least-privilege tests if the management API is unreachable.
          AMQP_INTEGRATION_REQUIRE_MANAGEMENT: '1'
      - run: npm pack --dry-run
